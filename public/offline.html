<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unlocked — hors ligne</title>
    <style>
      :root {
        --bg: #f5f5f5;
        --card: #ffffff;
        --text: #1a1a1a;
        --muted: #6b7280;
        --border: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 22rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 2rem 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 300;
      }
      h1 strong {
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        padding: 0.6rem 1rem;
        font: inherit;
        font-size: 0.875rem;
        color: #fff;
        background: var(--text);
        border: 0;
        border-radius: 0.6rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Tu es <strong>hors ligne</strong></h1>
      <p>
        Unlocked a besoin d'une connexion : les scores, les votes et les paris
        changent en permanence, on préfère ne rien te montrer plutôt que de
        t'afficher des chiffres périmés.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
