# Production stack for the VPS. Configuration comes from a `.env` file sitting
# next to this one — see `.env.example`, section "Deployment".
services:
  app:
    image: ${IMAGE:?set IMAGE to the published ghcr.io tag}
    restart: unless-stopped
    environment:
      # Auth.js derives the Discord callback URL from this; it must match the
      # redirect URI registered on the Discord application.
      AUTH_URL: https://${DOMAIN:?set DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:?set AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:?set AUTH_DISCORD_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    volumes:
      # The SQLite file, its snapshots and the uploaded proofs. Everything that
      # must outlive an image swap is under this single mount.
      - data:/data
    healthcheck:
      # `/login` is the only page reachable without a session.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Covers the backup + migrate + seed the entrypoint runs before serving.
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the Let's Encrypt account and certificates; losing it means
      # re-issuing on every restart, which the ACME rate limits punish.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  data:
  caddy-data:
  caddy-config:
