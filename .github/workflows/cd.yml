name: CD

# Chained on CI rather than on `push` directly: a red build must never reach
# the VPS. `workflow_dispatch` re-deploys the current main on demand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  publish:
    name: build · push
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `workflow_run` events point at the default branch head, not at the
          # commit CI actually validated.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - id: ref
        name: Compute the image references
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"   # GHCR rejects uppercase
          {
            echo "image=$repository:$(git rev-parse HEAD)"
            echo "latest=$repository:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Authorise the SSH connection
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # `ssh-keyscan <host>` on the VPS, pasted into the secret. Scanning
          # here instead would trust whatever answers on the day.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Log the VPS into the registry
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          # Ephemeral: this token dies with the workflow run. Piped through
          # stdin so it never shows up in the remote process list.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy "$TARGET" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

      - name: Ship the stack definition
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Keeps the VPS from drifting away from the repository. `.env` lives
          # only on the machine and is never touched.
          scp -i ~/.ssh/id_deploy compose.yaml Caddyfile "$TARGET:$DEPLOY_PATH/"

      - name: Pull and restart
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          # Directory on the VPS holding compose.yaml, Caddyfile and .env.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" \
            "IMAGE='$IMAGE' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose pull app
          # `--wait` blocks on the healthcheck, so a container that crashes on
          # its migration fails the deployment instead of passing silently.
          docker compose up -d --wait --wait-timeout 180 --remove-orphans
          docker image prune -f
          REMOTE
