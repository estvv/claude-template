# Local dev stack: builds the image from source and serves it directly on
# :3000 — no Caddy/TLS, localhost doesn't need a reverse proxy. Kept as a
# separate file rather than a compose.override.yaml: merging into
# compose.yaml would still require dummy IMAGE/DOMAIN values (Compose
# resolves each file's required vars before merging), which don't otherwise
# matter for local use.
#
# Usage: docker compose -f compose.dev.yaml up --build
#
# Fixture data (users/group/achievements to click through) isn't seeded
# automatically — run it once the container is up. `fixtures.ts` refuses
# NODE_ENV=production on purpose (keeps fake data out of a real deploy); the
# runner image hardcodes that (see Dockerfile), so override it just for this
# one-off exec, not for the server itself:
#   docker compose -f compose.dev.yaml exec -e NODE_ENV=development app \
#     node /tools/node_modules/tsx/dist/cli.mjs prisma/fixtures.ts
services:
  app:
    build:
      context: .
    environment:
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Optional here: the app boots without a Discord app configured, sign-in
      # just won't work until these are set.
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:-}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      - "3000:3000"
    volumes:
      - dev-data:/data

volumes:
  dev-data:
